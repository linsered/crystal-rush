<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Crystal Rush · 水晶疾跑</title>
<style>
  :root {
    --ink: #fff;
    --gold: #ffd24a;
    --shadow: 0 2px 10px rgba(0, 0, 0, .55);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #78abe6;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  canvas { display: block; }

  #hud {
    position: fixed; top: 18px; left: 22px; z-index: 10;
    color: var(--ink); text-shadow: var(--shadow);
    pointer-events: none; line-height: 1.45;
  }
  #hud .score { font-size: 30px; font-weight: 700; color: var(--gold); letter-spacing: .5px; }
  #hud .time  { font-size: 30px; font-weight: 700; color: #d8eeff; }

  #hint {
    position: fixed; left: 22px; bottom: 18px; z-index: 10;
    color: rgba(255, 255, 255, .92); font-size: 14px;
    text-shadow: var(--shadow); pointer-events: none;
  }
  #hint kbd {
    display: inline-block; padding: 1px 6px; margin: 0 2px;
    border-radius: 4px; background: rgba(255, 255, 255, .18);
    border: 1px solid rgba(255, 255, 255, .35);
    font-family: inherit; font-size: 13px;
  }

  #banner {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; color: #fff; text-align: center;
    background: rgba(12, 26, 44, .55);
    backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none;
    transition: opacity .28s ease;
  }
  #banner.show { opacity: 1; pointer-events: auto; }
  #banner h1 { margin: 0; font-size: 52px; letter-spacing: 1px; text-shadow: var(--shadow); }
  #banner p  { margin: 0; font-size: 17px; color: rgba(255, 255, 255, .86); }
  #banner button {
    margin-top: 6px; padding: 12px 34px; font-size: 17px; font-weight: 600;
    color: #14263c; background: var(--gold); border: 0; border-radius: 999px;
    cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, .3);
    font-family: inherit;
  }
  #banner button:hover { filter: brightness(1.06); }

  #loading {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    background: #78abe6; color: #fff; font-size: 17px; letter-spacing: .5px;
    transition: opacity .4s ease;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="hud">
  <div class="score" id="ui-score">COINS 0 / 8</div>
  <div class="time"  id="ui-time">TIME 60</div>
</div>

<div id="hint">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 ·
  <kbd>空格</kbd> 跳跃 · <kbd>R</kbd> 重开
</div>

<div id="banner">
  <h1 id="banner-title">ALL COINS COLLECTED!</h1>
  <p id="banner-sub">用时 <span id="banner-time">0</span> 秒</p>
  <button id="banner-btn">再玩一次</button>
</div>

<div id="loading">正在加载资产…</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
